# Runs the unit tests and the page smoke test on every push and pull request. It reports only: GitHub Pages
# publishes the site whether or not this passes.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: node --test "**/*.test.js"
      - name: Page smoke test
        run: node tools/smoke.mjs
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: qc-out/
          retention-days: 14
